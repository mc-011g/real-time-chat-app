name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - nodejs-backend
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create an .env file
        run: |
          echo "VITE_ATLAS_URI=${{ secrets.VITE_ATLAS_URI }}" >> front-end/.env
          echo "VITE_DB_NAME=${{ secrets.VITE_DB_NAME }}" >> front-end/.env
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" >> front-end/.env
          echo "VITE_SOCKET_IO_URL=${{ secrets.VITE_SOCKET_IO_URL }}" >> front-end/.env
          echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}" >> front-end/.env
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" >> front-end/.env
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}" >> front-end/.env
          echo "VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" >> front-end/.env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" >> front-end/.env
          echo "VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}" >> front-end/.env
      - name: Install Node.js
        uses: actions/setup-node@v4
